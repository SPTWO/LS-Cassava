# Supabase free projects pause after 7 days without activity.
# This pings the database every 3 days so it stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST API
        run: |
          URL=$(grep -oE "url: *'[^']+'" js/config.js | cut -d"'" -f2)
          KEY=$(grep -oE "anonKey: *'[^']+'" js/config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/settings?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" -lt 500
